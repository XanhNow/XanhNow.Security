syntax = "proto3";

option csharp_namespace = "GrpcTokenProvider.Grpc";

package grpc_token_provider;

import "google/protobuf/timestamp.proto";

service TokenProvider {
  rpc IssueToken (IssueTokenRequest) returns (TokenPairResponse);
  rpc RefreshToken (RefreshTokenRequest) returns (TokenPairResponse);
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc RevokeToken (RevokeTokenRequest) returns (RevokeTokenResponse);
  rpc ListSessions (ListSessionsRequest) returns (ListSessionsResponse);
  rpc RevokeAllSessions (RevokeAllSessionsRequest) returns (RevokeAllSessionsResponse);
}

message IssueTokenRequest {
  string subject = 1;
  repeated string roles = 2;
  repeated string scopes = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message ValidateTokenRequest {
  string jwt = 1;
}

message RevokeTokenRequest {
  string refresh_token = 1;
  string session_id = 2;
}

message ListSessionsRequest {
  string subject = 1;
}

message RevokeAllSessionsRequest {
  string subject = 1;
  string reason_code = 2;
  bool include_current_session = 3;
  string current_session_id = 4;
}

message TokenPairResponse {
  string jwt = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp jwt_expiry = 3;
  google.protobuf.Timestamp refresh_token_expiry = 4;
  string session_id = 5;
}

message ValidateTokenResponse {
  bool is_valid = 1;
  string subject = 2;
  repeated string roles = 3;
  repeated string scopes = 4;
  string session_id = 5;
}

message RevokeTokenResponse {
  bool is_revoked = 1;
  google.protobuf.Timestamp revoked_at = 2;
}

message SessionDescriptor {
  string session_id = 1;
  string subject = 2;
  string status = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp last_seen_at = 5;
  google.protobuf.Timestamp expires_at = 6;
}

message ListSessionsResponse {
  repeated SessionDescriptor sessions = 1;
}

message RevokeAllSessionsResponse {
  int32 revoked_count = 1;
  google.protobuf.Timestamp revoked_at = 2;
}
